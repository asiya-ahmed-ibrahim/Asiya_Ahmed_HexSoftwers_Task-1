<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>To-Do List</h1>
        <p>Organize your tasks and boost your productivity.</p>
      </header>
      <div class="m">
        <div class="input-row">
          <input
            type="text"
            id="task-input"
            placeholder="What needs to be done?"
            maxlength="200"
          />
          <button class="btn-add" id="add-btn" title="Add task">+</button>
        </div>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="done">Done</button>
        </div>

        <!-- Task List -->
        <ul id="task-list"></ul>
      </div>

      <!-- Footer -->
      <div class="stats">
        <span id="count-label">0 tasks remaining</span>
        <button class="clear-btn" id="clear-btn">Clear completed</button>
      </div>
    </div>
    <script src="./js/script.js"></script>
  </body>
</html>
